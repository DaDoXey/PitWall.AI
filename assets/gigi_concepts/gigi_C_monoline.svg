<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Gigi - race engineer">
  <!-- Concept C: badge monoline (solo tratto), stile strumentale -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="#0a0a0a" stroke="#222222" stroke-width="1.5"/>
  <!-- anello accento -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#E8002D" stroke-width="1.5" opacity="0.5"/>
  <!-- testa (tratto) -->
  <circle cx="32" cy="27" r="9" fill="none" stroke="#FFFFFF" stroke-width="2.6"/>
  <!-- spalle (tratto) -->
  <path d="M17 50c0-9 6.7-14 15-14s15 5 15 14" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
  <!-- archetto + padiglioni cuffia -->
  <path d="M21 27a11 11 0 0 1 22 0" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="21" y1="26" x2="21" y2="31" stroke="#E8002D" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="43" y1="26" x2="43" y2="31" stroke="#E8002D" stroke-width="3.4" stroke-linecap="round"/>
  <!-- microfono -->
  <path d="M21 31c-2 3-2 6 0 8" fill="none" stroke="#E8002D" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="21" cy="40" r="2.2" fill="#E8002D"/>
</svg>
