<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Gigi - race engineer">
  <!-- Concept A: busto con cuffie da muretto + microfono -->
  <circle cx="32" cy="32" r="32" fill="#111111"/>
  <!-- spalle -->
  <path d="M14 56c0-9 8-15 18-15s18 6 18 15z" fill="#FFFFFF"/>
  <!-- testa -->
  <circle cx="32" cy="26" r="11" fill="#FFFFFF"/>
  <!-- archetto cuffie -->
  <path d="M19 26a13 13 0 0 1 26 0" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- padiglioni -->
  <rect x="16" y="24" width="5" height="8" rx="2.5" fill="#E8002D"/>
  <rect x="43" y="24" width="5" height="8" rx="2.5" fill="#E8002D"/>
  <!-- braccetto microfono -->
  <path d="M18.5 30c-3 4-3 8-1 11" fill="none" stroke="#E8002D" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="18" cy="41" r="2.6" fill="#E8002D"/>
</svg>
