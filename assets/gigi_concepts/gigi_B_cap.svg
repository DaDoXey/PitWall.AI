<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Gigi - race engineer">
  <!-- Concept B: ingegnere con cappellino da team + cuffie -->
  <circle cx="32" cy="32" r="32" fill="#111111"/>
  <!-- spalle -->
  <path d="M13 57c0-10 8.5-16 19-16s19 6 19 16z" fill="#FFFFFF"/>
  <!-- testa -->
  <circle cx="32" cy="27" r="10.5" fill="#FFFFFF"/>
  <!-- cappellino: cupola + visiera -->
  <path d="M22 23a10 10 0 0 1 20 0z" fill="#E8002D"/>
  <path d="M40 23h7a2 2 0 0 1 0 4H40z" fill="#E8002D"/>
  <!-- padiglione cuffia laterale -->
  <rect x="42.5" y="25" width="5" height="8" rx="2.5" fill="#1a1a1a" stroke="#E8002D" stroke-width="1.5"/>
  <!-- braccetto microfono -->
  <path d="M44 32c1.5 4 0 7-3 9" fill="none" stroke="#E8002D" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="40" cy="41.5" r="2.4" fill="#E8002D"/>
</svg>
